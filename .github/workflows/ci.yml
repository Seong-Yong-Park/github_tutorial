name: CI

# PR 에서 게이트 역할을 하고, main 에서는 머지 후 상태를 남긴다.
on:
  pull_request:
  push:
    branches: [main]

# 같은 PR 에 연속으로 push 하면 앞선 실행을 취소한다. 러너 시간 낭비 방지.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ↓ 이 job 의 name 이 곧 Ruleset 에 지정할 status check 이름이 된다.
  #   워크플로 이름(CI)도 step 이름도 아니다.
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # 기본 탐색 대상은 requirements.txt 다. 이 repo 는 의존성이
          # pyproject.toml 에만 있으므로 명시해 준다.
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q
