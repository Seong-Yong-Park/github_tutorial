# .github/ISSUE_TEMPLATE/feature_request.yml
name: 기능 요청
description: 새로 만들거나 바꾸고 싶은 것
labels: ["feature"]
body:
  - type: input
    id: req-id
    attributes:
      label: 관련 Notion 요구사항 ID
      description: Notion SYS-REQ DB의 ID. 없으면 먼저 요구사항부터 등록하세요
      placeholder: REQ-
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 푸는가
      description: 해결책이 아니라 문제를 먼저
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 이슈를 닫을 수 있나
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
