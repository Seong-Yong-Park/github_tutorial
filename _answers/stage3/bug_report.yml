# .github/ISSUE_TEMPLATE/bug_report.yml
name: 버그 리포트
description: 동작이 기대와 다를 때
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나
      description: 기대한 동작과 실제 동작을 각각
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: req-id
    attributes:
      label: 관련 Notion 요구사항 ID
      description: 있으면 REQ-012 형식으로. 없으면 비워두세요
      placeholder: REQ-

  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - P0 - 주행 불가 / 안전 문제
        - P1 - 기능 동작 안 함
        - P2 - 불편하지만 우회 가능
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / rosbag
      render: shell
