# .github/workflows/add-to-project.yml
name: Add to project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          # Project URL. 조직이면 orgs/<org>/projects/<n>, 개인이면 users/<user>/projects/<n>
          project-url: https://github.com/users/OWNER/projects/1
          # 설정 → Developer settings → PAT(classic, project 권한)를 secret 으로
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
